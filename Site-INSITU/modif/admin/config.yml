collections:
  - name: "projets"
    label: "Projets"
    folder: "modif/_projets"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "ID (ex: test-x2)", name: "id", widget: "string" }
      - { label: "Image miniature", name: "image", widget: "image" }
      - { label: "Informations", name: "infos", widget: "string" }
      - { label: "Texte d'introduction", name: "intro", widget: "text" }