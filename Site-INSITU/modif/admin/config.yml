backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/projets"
public_folder: "/assets/images/projets"

publish_mode: simple
locale: "fr"

collections:
  - name: "projets"
    label: "Projets / Réalisations"
    label_singular: "Projet"
    folder: "content/projets"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: true

    fields:
      - { label: "Identifiant unique (sans espaces)", name: "id", widget: "string", hint: "Ex: mon-nouveau-projet" }
      - { label: "Titre du projet", name: "title", widget: "string", hint: "Ex: Studio Horizon" }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Année affichée", name: "annee", widget: "string", default: "2026" }
      - { label: "Pastille / Statut", name: "pastille", widget: "select", options: ["Projet client", "Projet fictif", "Création perso"], default: "Projet client" }
      - { label: "Tags / Spécialités (Carte)", name: "tags", widget: "string", hint: "Ex: Identité visuelle · Print · Web" }
      - { label: "Image de couverture (Carte)", name: "image_cover", widget: "image" }

      # --- PERSONNALISATION DES COULEURS DE LA FICHE ---
      - label: "Palette de couleurs de la fiche"
        name: "couleurs"
        widget: "object"
        fields:
          - { label: "Couleur de fond", name: "fond", widget: "color", default: "#0F1417" }
          - { label: "Couleur du texte", name: "texte", widget: "color", default: "#EEEEF0" }
          - { label: "Couleur d'accent principale", name: "accent", widget: "color", default: "#53E6D4" }
          - { label: "Couleur d'accent secondaire", name: "accent2", widget: "color", default: "#6045F4" }
          - { label: "Couleur des cadres", name: "cadre", widget: "color", default: "#161D21" }

      # --- INFORMATIONS DE LA POP-UP / FICHE ---
      - { label: "Nom du client", name: "client", widget: "string", required: false }
      - { label: "Mission", name: "mission", widget: "string", required: false }
      - { label: "Livrables fournis", name: "livrables", widget: "string", required: false }
      - { label: "Mots-clés", name: "mots_cles", widget: "string", required: false }
      - { label: "Texte d'introduction / Histoire", name: "intro", widget: "text", required: false }

      # --- VISUELS DE LA POP-UP ---
      - label: "Galerie d'images de la fiche"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }